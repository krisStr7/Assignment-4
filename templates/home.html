{% extends "layout.html" %}
{% block content %}

<h2>Employee Overview</h2>

<form method="GET" class="row mb-3">
    <!-- Search by name -->
    <div class="col-md-4">
        <input class="form-control" 
               name="search" 
               placeholder="Search name..." 
               value="{{ search }}">
    </div>

    <!-- Department filter -->
    <div class="col-md-3">
        <select class="form-control" name="dept">
            <option value="">All Departments</option>
            {% for d in departments %}
            <option value="{{ d[0] }}" 
                {% if dept|int == d[0] %}selected{% endif %}>
                {{ d[1] }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- Sorting -->
    <div class="col-md-3">
        <select class="form-control" name="sort">
            <option value="name_asc" {% if sort=='name_asc' %}selected{% endif %}>Name ↑</option>
            <option value="name_desc" {% if sort=='name_desc' %}selected{% endif %}>Name ↓</option>
            <option value="hours_asc" {% if sort=='hours_asc' %}selected{% endif %}>Hours ↑</option>
            <option value="hours_desc" {% if sort=='hours_desc' %}selected{% endif %}>Hours ↓</option>
        </select>
    </div>

    <!-- Submit -->
    <div class="col-md-2">
        <button class="btn btn-primary w-100">Apply</button>
    </div>
</form>

<!-- Employee Table -->
<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Department</th>
            <th># Dependents</th>
            <th># Projects</th>
            <th>Total Hours</th>
        </tr>
    </thead>

    <tbody>
        {% for e in employees %}
        <tr>
            <td>{{ e[1] }} {{ e[2] }} {{ e[3] }}</td>
            <td>{{ e[4] }}</td>
            <td>{{ e[5] }}</td>
            <td>{{ e[6] }}</td>
            <td>{{ e[7] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
