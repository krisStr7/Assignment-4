{% extends "layout.html" %}
{% block content %}
<br>
<br>
<!--Header-->
<h2>Managers Overview</h2>
<br>
<br>

<!--creates table for all the info-->
<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <!--table headers-->
            <th>Department Name</th>
            <th>Department Number</th>
            <th>Manager Name</th>
            <th>Number of Employees</th>
            <th>Total Hours</th>
        </tr>
    </thead>
    <tbody>
        <!--loop through the manager's info-->
        {% for d in managers %}
        <tr>
            <td>{{ d[0] }}</td>
            <td>{{ d[1] }}</td>
            <td>{{ d[2] }}</td>
            <td>{{ d[3] }}</td>
            <td>{{ d[4] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
